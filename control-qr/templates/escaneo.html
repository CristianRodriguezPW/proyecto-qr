<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escanear QR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>Escanear QR</h1>

        <div id="lector-qr"></div>

        <div id="resultado"></div>

        <a class="boton boton-secundario" href="{{ url_for('bitacora') }}">Ver bitácora</a>
    </div>

    <script>
        const resultadoDiv = document.getElementById("resultado");
        let procesando = false;

        function mostrarResultado(html, clase) {
            resultadoDiv.innerHTML = `<div class="resultado ${clase}">${html}</div>`;
        }

        async function onScanSuccess(decodedText) {
            if (procesando) return;   // evita mandar el mismo QR varias veces seguidas
            procesando = true;

            try {
                const resp = await fetch("/api/escanear", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ uuid: decodedText })
                });
                const data = await resp.json();

                if (data.ok) {
                    const etiqueta = data.tipo === "entrada" ? "Entrada registrada" : "Salida registrada";
                    mostrarResultado(
                        `<strong>${data.equipo}</strong> — ${etiqueta}<br>${data.nombre} · ${data.hora}`,
                        data.tipo
                    );
                } else {
                    mostrarResultado(data.mensaje, "error");
                }
            } catch (err) {
                mostrarResultado("No se pudo conectar con el servidor.", "error");
            }

            // deja pasar 3 segundos antes de aceptar otro escaneo
            setTimeout(() => { procesando = false; }, 3000);
        }

        const escaner = new Html5Qrcode("lector-qr");
        escaner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        ).catch((err) => {
            mostrarResultado("No se pudo acceder a la cámara: " + err, "error");
        });
    </script>
</body>
</html>
